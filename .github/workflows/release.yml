name: Build and Release

on:
  push:
    branches:
      - main

env:
  ARTIFACT_NAME: qupath-extension-concentriq-1.0.0-tumbling-turkey

jobs:
  build_jar:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build

      - name: List built jars
        run: ls build/libs

      - name: Upload jar as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: build/libs/${{ env.ARTIFACT_NAME }}.jar

  create_release:
    needs: build_jar
    runs-on: ubuntu-latest
    # Required for softprops/action-gh-release to be able to create a release
    # and upload assets using the automatically-provided GITHUB_TOKEN.
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: build/libs

      - name: Compute short SHA
        id: vars
        run: echo "sha_short=$(echo "$GITHUB_SHA" | cut -c1-8)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: "Release ${{ steps.vars.outputs.sha_short }}"
          tag_name: "v-${{ steps.vars.outputs.sha_short }}"
          target_commitish: ${{ github.sha }}
          body: "Automatic release from branch implement-concentriq-ext"
          files: build/libs/${{ env.ARTIFACT_NAME }}.jar

